name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:unit
      - run: npm run test:smoke
      - run: npm run test:package
      - if: matrix.node == 24
        run: npm run fixture:install
      - if: matrix.node == 24
        run: npm run test:independent
      - if: matrix.node == 24
        run: npm run benchmark -- --output /tmp/mcpcl-benchmark.json
      - run: npm run cli -- test -c examples/mcpcl.parameterized.yaml --allow-exec --report json
      - run: npm run cli -- test -c examples/mcpcl.config.yaml --allow-exec --report junit --output /tmp/mcpcl-junit.xml
      - run: npm run cli -- inspect -c examples/mcpcl.config.yaml --allow-exec
      - run: npm run cli -- test -c examples/mcpcl.config.yaml --allow-exec
      - run: npm run cli -- snapshot -c examples/mcpcl.config.yaml --allow-exec --output /tmp/mcpcl-baseline.json
      - run: npm run cli -- diff -c examples/mcpcl.config.yaml --allow-exec --baseline /tmp/mcpcl-baseline.json
      - name: Verify removed tool compatibility gate exits 1
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=JSON.parse(fs.readFileSync("/tmp/mcpcl-baseline.json","utf8")); s.tools.push({name:"previously-present",inputSchema:{type:"object"}}); fs.writeFileSync("/tmp/mcpcl-removed.json",JSON.stringify(s));'
          set +e
          npm run cli -- diff -c examples/mcpcl.config.yaml --allow-exec --baseline /tmp/mcpcl-removed.json
          actual_status=$?
          set -e
          test "$actual_status" -eq 1
      - run: npm run demo -- --allow-exec
      - name: Verify three broken contracts exit 1
        shell: bash
        run: |
          set +e
          npm run cli -- test -c examples/mcpcl.broken.yaml --allow-exec
          actual_status=$?
          set -e
          test "$actual_status" -eq 1
      - name: Verify deliberate failing expectation exits 1
        shell: bash
        run: |
          set +e
          npm run demo -- --allow-exec --expect-sum 6
          actual_status=$?
          set -e
          test "$actual_status" -eq 1
