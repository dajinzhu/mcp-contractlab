name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:unit
      - run: npm run test:smoke
      - run: npm run demo -- --allow-exec
      - name: Verify deliberate failing expectation exits 1
        shell: bash
        run: |
          set +e
          npm run demo -- --allow-exec --expect-sum 6
          actual_status=$?
          set -e
          test "$actual_status" -eq 1
